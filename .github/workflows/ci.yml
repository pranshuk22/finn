name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, format, tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check backend tests eval
      - run: uv run ruff format --check backend tests eval
      - run: uv run pytest -q

  frontend:
    name: Frontend (types, tests, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  house-style:
    name: House style (no em or en dashes)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fail on U+2013 or U+2014 anywhere in tracked text
        run: |
          if git grep -nIP '\x{2013}|\x{2014}' -- . ':!*.lock' ':!frontend/bun.lock'; then
            echo "Found an em or en dash. Use a comma, colon, parentheses or a hyphen instead."
            exit 1
          fi

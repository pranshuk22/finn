<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f1ec" />
    <meta name="description" content="A brief you can finish on your portfolio's filings, and research grounded in what management said." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <title>FINN</title>
  </head>
  <body>
    <script>
      // Apply saved appearance before the first paint so no one sees the wrong theme flash.
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem("finn:settings") || "{}");
          var t = s.theme || "paper";
          if (t === "system") t = matchMedia("(prefers-color-scheme: light)").matches ? "paper" : "slate";
          var d = document.documentElement;
          d.dataset.theme = t;
          d.dataset.accent = s.accent || "steel";
          d.dataset.type = s.type || "modern";
          d.dataset.size = s.size || "standard";
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
